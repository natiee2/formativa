{% extends 'prestamos/base.html' %}
{% block title %}Eliminar Categoría{% endblock %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto text-center p-4">
    <h3>¿Estás seguro?</h3>
    <p class="text-muted">Estás a punto de eliminar la categoría <strong>{{ categoria.nombre }}</strong>.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'categoria_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}

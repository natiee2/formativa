{% extends 'prestamos/base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-body p-4">
        <h3 class="mb-3">{{ titulo }}</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark w-100">Guardar</button>
        </form>
        <a href="{% url 'categoria_list' %}" class="btn btn-link w-100 mt-2">Cancelar</a>
    </div>
</div>
{% endblock %}
